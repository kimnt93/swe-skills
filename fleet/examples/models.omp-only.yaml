# Setup B: oh-my-pi is the only coding agent. Workers and reviewers can be any provider omp is logged
# in to (omp login openai-codex | google-antigravity | anthropic ...; omp models ls lists the ids).
# One lane, so the reviewer is the same lane at tier top (gpt-6-sol high) while most cards run on
# tier mid or low: pick a reviewer model from a different family than the one that wrote the card.
# Use it with:
#   FLEET_MODELS=fleet/examples/models.omp-only.yaml fleet bootstrap
# The project managers' brain (board.manager.brain) still names Anthropic: change it to a provider
# Hermes is logged in to (hermes auth add <provider>; hermes model lists the ids).
board:
  root:
    profile: default
    brain:
      provider: gemini
      model: gemini-3.8-flash
    tools:
      enable:
      - kanban
      - terminal
      - memory
      disable:
      - file
      - code_execution
      - browser
      - delegation
    skills:
    - fleet-admin
    - github
    description: Root. Manages projects and profiles, routes each request to its project's manager, reports across projects.
      Never edits repositories.
  manager:
    brain:
      provider: anthropic
      model: claude-sonnet-5-5
    tools:
      enable:
      - kanban
      - terminal
      - memory
      disable:
      - file
      - code_execution
      - web
      - browser
      - delegation
    skills:
    - fleet-manager
    - project
    - github
    description: 'Manager of project {project} only ({description}). Orchestrates: issues, cards, docs and repo upkeep through
      cards, merges only when the human approves. Never edits code.'
lanes:
  omp:
    cli: omp
    brain:
      provider: gemini
      model: gemini-3.8-flash
    tools:
      disable:
      - web
      - browser
    skills:
    - fleet-worker
    - github
    description: 'Lane: runs cards with oh-my-pi for any project. Implements cards and reviews its own earlier work at the
      reviewer tier, on another model.'
workers:
  omp:
    top:
      model: openai-codex/gpt-6-sol
      thinking: high
    mid:
      model: openai-codex/gpt-6-sol
      thinking: medium
    low:
      model: google-antigravity/gemini-3.8-flash
      thinking: low
reviewers:
  omp:
    lane: omp
    tier: top
subagents: {}
omp_roles:
  default: google-antigravity/gemini-3.8-flash
  smol: google-antigravity/gemini-3.8-flash
  slow: openai-codex/gpt-6-sol
kanban:
  dispatch_in_gateway: true
  review_dispatch: true
  failure_limit: 2
  max_in_progress: 6
  max_in_progress_per_profile: 2
  auto_decompose: false
  orchestrator_profile: ''
autopilot:
  auto_merge: []
