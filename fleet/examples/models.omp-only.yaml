# Setup B: oh-my-pi is the only coding agent, on OpenAI (omp login openai-codex) and Google (omp login google-antigravity) logins.
# One CLI, so the reviewer is omp at tier top, in a fresh session that sees only the diff and the card.
# The orchestrator is oh-my-pi itself (fleet orchestrate <project>).
# Use it with: FLEET_MODELS=fleet/examples/models.omp-only.yaml fleet bootstrap
# Hermes is off (board.enabled: false); set it true to also run Hermes managers (on Gemini, never Claude).
orchestrator:
  cli: omp
  tier: mid
launcher: tmux
board:
  enabled: false
  root:
    profile: default
    brain:
      provider: gemini
      model: gemini-3.8-flash
    tools:
      enable:
      - kanban
      - terminal
      - memory
      disable:
      - file
      - code_execution
      - browser
      - delegation
    skills:
    - fleet-admin
    - github
    description: Root. Manages projects and profiles, routes each request to its project's manager, reports across
      projects. Never edits repositories.
  manager:
    brain:
      provider: gemini
      model: gemini-3.8-flash
    tools:
      enable:
      - kanban
      - terminal
      - memory
      disable:
      - file
      - code_execution
      - web
      - browser
      - delegation
    skills:
    - fleet-manager
    - project
    - github
    description: 'Manager of project {project} only ({description}). Orchestrates: issues, cards, docs and repo
      upkeep through cards, merges only when the human approves. Never edits code.'
clis:
  omp:
    approval_mode: yolo
    ready: "\u03C0 >"
    busy: "\u238B"
workers:
  omp:
    top:
      model: openai-codex/gpt-6-sol
      thinking: high
    mid:
      model: openai-codex/gpt-6-sol
      thinking: medium
    low:
      model: google-antigravity/gemini-3.8-flash
      thinking: low
reviewers:
  omp:
    cli: omp
    tier: top
subagents: {}
omp_roles:
  default: google-antigravity/gemini-3.8-flash
  smol: google-antigravity/gemini-3.8-flash
  slow: openai-codex/gpt-6-sol
context:
  default:
    window: 272000
    compact_at: 245000
  families:
    claude:
      window: 400000
      compact_at: 350000
  models: {}
kanban:
  dispatch_in_gateway: true
  review_dispatch: true
  failure_limit: 2
  max_in_progress: 6
  max_in_progress_per_profile: 2
  auto_decompose: false
  orchestrator_profile: ''
autopilot:
  auto_merge: []
