# Setup A: Claude Code is the only coding agent, on your Claude subscription (claude auth login).
# One lane, so no second model family reviews: the reviewer is the same lane at tier top (Opus), in a
# fresh session that sees only the diff and the card. Use it with:
#   FLEET_MODELS=fleet/examples/models.claude-only.yaml fleet bootstrap
# Check Hermes' exact Anthropic model ids with `hermes model` after `hermes auth add anthropic`.
board:
  root:
    profile: default
    brain:
      provider: anthropic
      model: claude-haiku-4-5
    tools:
      enable:
      - kanban
      - terminal
      - memory
      disable:
      - file
      - code_execution
      - browser
      - delegation
    skills:
    - fleet-admin
    - github
    description: Root. Manages projects and profiles, routes each request to its project's manager, reports across projects.
      Never edits repositories.
  manager:
    brain:
      provider: anthropic
      model: claude-sonnet-5-5
    tools:
      enable:
      - kanban
      - terminal
      - memory
      disable:
      - file
      - code_execution
      - web
      - browser
      - delegation
    skills:
    - fleet-manager
    - project
    - github
    description: 'Manager of project {project} only ({description}). Orchestrates: issues, cards, docs and repo upkeep through
      cards, merges only when the human approves. Never edits code.'
lanes:
  claude:
    cli: claude
    brain:
      provider: anthropic
      model: claude-haiku-4-5
    tools:
      disable:
      - web
      - browser
    skills:
    - fleet-worker
    - github
    description: 'Lane: runs cards with Claude Code for any project. Implements cards and reviews its own earlier work at
      the reviewer tier.'
workers:
  claude:
    top:
      model: opus
      effort: xhigh
    mid:
      model: sonnet
      effort: high
    low:
      model: haiku
reviewers:
  claude:
    lane: claude
    tier: top
subagents:
  worker:
    tier: mid
  adversary:
    tier: top
omp_roles: {}
kanban:
  dispatch_in_gateway: true
  review_dispatch: true
  failure_limit: 2
  max_in_progress: 6
  max_in_progress_per_profile: 2
  auto_decompose: false
  orchestrator_profile: ''
autopilot:
  auto_merge: []
context:
  default:
    window: 272000
    compact_at: 245000
  families:
    claude:
      window: 400000
      compact_at: 350000
  models: {}
