# fleet/models.yaml: every agent of the fleet, by level, and the model each one uses.
# Projects (one manager profile and one board each) are listed in fleet/projects.yaml.
#
#   fleet models show      who uses what
#   fleet models check     every model exists where it will run, every provider is logged in
#   fleet models apply     push this file to Hermes and omp
#   fleet bootstrap        create or update every profile, board and project binding
#
# Skills never name a model: they name a tier (top, mid, low). A new model (say Opus 6) is an edit
# here plus `fleet models check && fleet models apply`.

# Orchestrator: the agent that runs a project. It is any CLI agent (claude, codex, omp) started in the
# project directory with the fleet-manager brief (`fleet orchestrate <project>`); a project may override it
# (`orchestrator:` in projects.yaml). Hermes is optional: set board.enabled true to also use Hermes
# profiles and boards (cheap router brains, chat from Telegram). The default is off.
orchestrator: {cli: claude, tier: mid}

# Where CLI sessions run: tmux (attach with tmux), or orca (terminals inside the Orca app, which also
# shows the worktrees). Both keep every session alive after you disconnect.
launcher: tmux

# Level 1. Board agents (optional): Hermes profiles that never write code. Used only when enabled.
board:
  enabled: false
  root:
    profile: default                 # the root profile: general purpose, manages profiles and projects,
                                     # routes every request to the right project's manager
    brain: {provider: gemini, model: gemini-3.8-flash}
    tools: {enable: [kanban, terminal, memory], disable: [file, code_execution, browser, delegation]}
    skills: [fleet-admin, github]
    description: "Root. Manages projects and profiles, routes each request to its project's manager, reports across projects. Never edits repositories."
  manager:                           # template for every project's manager profile (pm-<project>)
    brain: {provider: gemini, model: gemini-3.8-flash}   # a router: cheap, and not Claude, so it still answers when Claude's quota runs out
    tools: {enable: [kanban, terminal, memory], disable: [file, code_execution, web, browser, delegation]}
    skills: [fleet-manager, project, github]
    description: "Manager of project {project} only ({description}). Orchestrates: issues, cards, docs and repo upkeep through cards, merges only when the human approves. Never edits code."

# Level 2. Coding CLIs. The orchestrator starts one in a session inside a git worktree
# (`fleet delegate start`), hands it the brief and reads its result. Each project has a default CLI
# (`cli:` in projects.yaml); the reviewer is another family (`reviewers`).
clis:
  claude:
    permission_mode: bypassPermissions   # Claude Code: Claude models only
    ready: "❯"                           # text in the pane when the prompt is ready for a brief
    busy: "esc to interrupt"             # text in the pane while it works
  codex:
    approval_policy: never               # Codex CLI: OpenAI models; sandbox danger-full-access inside a worktree
    sandbox: danger-full-access
    ready: "›"                           # the composer prompt
    busy: "esc to interrupt"
  omp:
    approval_mode: yolo                  # oh-my-pi: OpenAI models (Codex login) and Google models (Antigravity login)
    ready: "π >"                         # the status line is up
    busy: "⎋"                            # the "⎋ Running ..." line while a tool runs

# Level 3. Workers: the model a CLI runs for a card, per tier.
# Claude aliases (opus, sonnet, haiku) follow the newest model after `claude update`;
# pin a full id (claude-opus-5-5) to make upgrades explicit.
workers:
  claude:
    top: {model: opus, effort: xhigh}
    mid: {model: sonnet, effort: high}       # the default for most cards
    low: {model: haiku}
  codex:
    top: {model: gpt-6-sol, effort: high}
    mid: {model: gpt-6-sol, effort: medium}
    low: {model: gpt-6-sol, effort: low}
  omp:
    top: {model: openai-codex/gpt-6-sol, thinking: high}
    mid: {model: openai-codex/gpt-6-sol, thinking: medium}
    low: {model: google-antigravity/gemini-3.8-flash, thinking: low}

# Level 4. Reviewers: which CLI reviews work written with each CLI (always the other family), at which tier.
reviewers:
  claude: {cli: omp, tier: top}        # Claude-written code is broken by gpt-6-sol
  codex: {cli: claude, tier: top}      # Codex-written code is broken by Opus
  omp: {cli: claude, tier: mid}        # GPT/Gemini-written code is broken by Sonnet

# Claude Code subagents shipped inside the plugin, as a tier of the claude workers.
subagents:
  worker: {tier: mid}
  adversary: {tier: top}

# omp's own internal subagents (scout, task, ...), written to ~/.omp/agent/config.yml.
omp_roles:
  default: google-antigravity/gemini-3.8-flash
  smol: google-antigravity/gemini-3.8-flash
  slow: openai-codex/gpt-6-sol

# Context policy: how many tokens a session may hold before its agent compacts it. `window` is the
# cap (Codex model_context_window, Hermes model.context_length); `compact_at` is where compaction
# starts. Claude models: 300-400k. Every other model follows the price break at about 272k, which
# is where Codex and Gemini prices step up. `fleet context show` prints what each tool gets;
# `fleet context apply` writes Claude Code, Codex and omp; `fleet sync` writes the Hermes profiles.
context:
  default: {window: 272000, compact_at: 245000}   # Codex, Gemini, GPT, and anything not listed
  families:
    claude: {window: 400000, compact_at: 350000}  # opus, sonnet, haiku, fable and claude-* ids
  models: {}                                      # exact overrides: "<model id>": {window: N, compact_at: N}

# Hermes board settings (kanban.*). Each project's manager splits its own work (it reads the
# project's ARCHITECTURE.md), so the global auto-decomposer is off and cards stay with their manager.
kanban:
  dispatch_in_gateway: true
  review_dispatch: true
  failure_limit: 2
  max_in_progress: 6
  max_in_progress_per_profile: 2
  auto_decompose: false
  orchestrator_profile: ""

# Autopilot (Trust Ladder rung 5): card risk classes the manager may merge without the human.
# Keep it empty until 20 cards merged cleanly. Money-path is refused even if listed; a human
# approval (`fleet merge --approved`) is the only way money-path merges.
autopilot:
  auto_merge: []                       # e.g. [low], later [low, standard]
