name: build-slot

on:
  push:
    paths:
      - src/skills/build-slot/**
      - tests/build_slot_test.py
      - scripts/build.py
      - scripts/install.py
      - Makefile
      - .github/workflows/build-slot.yml
  pull_request:
    paths:
      - src/skills/build-slot/**
      - tests/build_slot_test.py
      - scripts/build.py
      - scripts/install.py
      - Makefile
      - .github/workflows/build-slot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tests/build_slot_test.py -v
