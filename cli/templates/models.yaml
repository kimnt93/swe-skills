# models.yaml: the ONE place that says which model runs at which tier. It lives in the project directory
# (`swe-cli init` copies it there; edit it freely). Roles (roles.yaml) and workflow nodes name only a tier
# (top, mid, low) and a harness; this file turns that into a model and an effort level.
#
#   swe-cli models show      who uses what
#   swe-cli models check     every model exists where it will run, every provider is logged in
#   swe-cli models apply     write omp's model roles
#
# A new model (say Opus 6) is an edit here plus `swe-cli models check`; nothing else names a model.
# tiers:  top = design and review, mid = building (the default), low = docs, changelog, mechanical work.

# Orchestrator: the agent that runs the project (`swe-cli orchestrate <project>`): any harness started in
# the project directory with AGENTS.md. A project may override it in project.yaml (`orchestrator:`).
orchestrator: {cli: claude, tier: mid}

# Where CLI sessions run: tmux (attach with tmux), or orca (terminals inside the Orca app, which also
# shows the worktrees). Both keep every session alive after you disconnect.
launcher: tmux

# Coding CLIs. The orchestrator starts one in a session inside a git worktree
# (`swe-cli delegate start`), hands it the brief and reads its result. Each project has a default CLI
# (`cli:` in projects.yaml); the reviewer is another family (`reviewers`).
clis:
  claude:
    permission_mode: bypassPermissions   # Claude Code: Claude models only
    ready: "❯"                           # text in the pane when the prompt is ready for a brief
    busy: "esc to interrupt"             # text in the pane while it works
  codex:
    approval_policy: never               # Codex CLI: OpenAI models; sandbox danger-full-access inside a worktree
    sandbox: danger-full-access
    ready: "›"                           # the composer prompt
    busy: "esc to interrupt"
  omp:
    approval_mode: yolo                  # oh-my-pi: OpenAI models (Codex login) and Google models (Antigravity login)
    ready: "π >"                         # the status line is up
    busy: "⎋"                            # the "⎋ Running ..." line while a tool runs

# Workers: the model a CLI runs for a card, per tier.
# Claude aliases (opus, sonnet, haiku) follow the newest model after `claude update`;
# pin a full id (claude-opus-5-5) to make upgrades explicit.
workers:
  claude:
    top: {model: opus, effort: xhigh}
    mid: {model: sonnet, effort: high}       # the default for most cards
    low: {model: haiku}
  codex:
    top: {model: gpt-6-sol, effort: high}
    mid: {model: gpt-6-sol, effort: medium}
    low: {model: gpt-6-luna, effort: low}   # documentation, mechanical cards
  omp:
    top: {model: openai-codex/gpt-6-sol, thinking: high}
    mid: {model: openai-codex/gpt-6-sol, thinking: medium}
    low: {model: google-antigravity/gemini-3.8-flash, thinking: low}

# Reviewers: which CLI reviews work written with each CLI (always the other family), at which tier.
reviewers:
  claude: {cli: omp, tier: top}        # Claude-written code is broken by gpt-6-sol
  codex: {cli: claude, tier: top}      # Codex-written code is broken by Opus
  omp: {cli: claude, tier: mid}        # GPT/Gemini-written code is broken by Sonnet

# Claude Code subagents shipped inside the plugin, as a tier of the claude workers.
subagents:
  worker: {tier: mid}
  adversary: {tier: top}

# omp's own internal subagents (scout, task, ...), written to ~/.omp/agent/config.yml.
omp_roles:
  default: google-antigravity/gemini-3.8-flash
  smol: google-antigravity/gemini-3.8-flash
  slow: openai-codex/gpt-6-sol

# Context policy: how many tokens a session may hold before its agent compacts it. `window` is the
# cap (Codex model_context_window); `compact_at` is where compaction
# starts. Claude models: 300-400k. Every other model follows the price break at about 272k, which
# is where Codex and Gemini prices step up. `swe-cli context show` prints what each tool gets;
# `swe-cli context apply` writes Claude Code, Codex and omp; 
context:
  default: {window: 272000, compact_at: 245000}   # Codex, Gemini, GPT, and anything not listed
  families:
    claude: {window: 400000, compact_at: 350000}  # opus, sonnet, haiku, fable and claude-* ids
  models: {}                                      # exact overrides: "<model id>": {window: N, compact_at: N}

# Autopilot (Trust Ladder rung 5): card risk classes the manager may merge without the human.
# Keep it empty until 20 cards merged cleanly. Money-path is refused even if listed; a human
# approval (`swe-cli merge --approved`) is the only way money-path merges.
autopilot:
  auto_merge: []                       # e.g. [low], later [low, standard]
