# cli/projects.yaml: one entry per project. `swe-cli project add` writes it; edit it freely, then
# `swe-cli project sync <name>` (or `swe-cli bootstrap`) applies it: creates the directory, clones the repos.
#
# A project is a directory that holds one or more repo clones. Two projects may clone the same GitHub
# repo (each in its own directory); cards of both are kept apart by branches and by the overlap check.
#
# <name>:
#   dir: ~/work/<name>                the project directory; clones live in <dir>/<repo>, worktrees in <dir>/.wt
#   description: <one line>
#   repos:
#     <repo>:                         the clone's folder name; also the --repo value
#       github: <owner>/<repo>        PRs, issues, branch protection, cross-project overlap checks
#       url: <clone url>              optional, when it is not github.com
#       hotspots: [schemas/, go.sum]  repo-relative paths that collide even between unrelated features: a card
#                                     that lists one holds it exclusively until it merges
#   cli: claude | codex | omp         the coding CLI cards use by default (default claude)
#   orchestrator: {cli: claude, tier: mid}   optional override of the orchestrator in models.yaml
# Hermes (board.enabled: true) derives pm-<name> as the manager profile and <name> as board and project.
projects: {}
