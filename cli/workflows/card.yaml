name: card
description: "One card: build in its own worktree, wait for CI (a fixer repairs a red check), review by another model family (it also brings the branch up to date and resolves conflicts), with a fix round on FAIL."
nodes:
  code:
    role: developer
    outcome: node
    goal: >-
      phase: code. ${item.goal}
    files: "${item.files}"
    agent: "${item.agent|developer-junior}"
    issue: "${item.issue}"
    risk: "${item.risk|standard}"
    branch_type: "${item.type|feat}"
  docs:
    role: docsync
    needs: [code]
    goal: >-
      Sync the docs of this change (docs-sync skill): compare the diff with docs/, update or add the usage in
      docs/references/ and the index in docs/README.md, run every command, commit. Do not push, do not open a PR.
  build:
    role: developer
    needs: [docs]
    workspace: "same:code"
    agent: "${item.agent|developer-junior}"
    goal: >-
      phase: pr. The docs step has committed. Verify, push and open the PR. ${item.goal}
  checks:
    type: checks
    needs: [build]
    timeout: 30
    on_fail: {run: ci-fix, rounds: 2}
  ci-fix:
    role: ci-fixer
    manual: true
    workspace: "same:build"
    goal: "A required check on the PR is red. Fix the cause on this branch (ci-fixer skill)."
  review:
    role: reviewer
    needs: [checks]
    reviews: build
    agent: "${item.reviewer|reviewer-junior}"
    workspace: "same:build"
    goal: >-
      Review this card's PR at its head against its issue and the goal: ${item.goal}. A fast check, not an audit: run
      the card's verify command once, compare the diff with the issue, the PR body and the files the card may touch, post
      the verdict. Run the adversarial fan-out only when you are reviewer-senior. First make sure the branch is up to date with
      origin/main; if it is behind or conflicts, bring it up to date as the integrator skill says (only inside this
      card's own files), re-run make verify, push with --force-with-lease. Then give your verdict on the final head.
    on_fail: {run: fix, rounds: 2}
  fix:
    role: developer
    manual: true
    agent: "${item.agent|developer-junior}"
    workspace: "same:build"
    goal: "Fix the verified review findings on this branch (developer skill). If a fix changes documented behaviour, update docs/ in the same commit. Original goal: ${item.goal}"
