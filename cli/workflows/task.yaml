name: task
description: "Developer mode: one task from the issue to an open PR: read or create the issue, code in a worktree, open the PR, wait for checks (a fixer repairs a red check). No review, no merge: you review and merge."
inputs:
  goal: {required: true}
  issue: {default: ""}
  repo: {default: ""}
  files: {default: ""}
  agent: {default: developer-junior}
  risk: {default: standard}
  type: {default: feat}
nodes:
  code:
    role: developer
    outcome: node
    goal: >-
      phase: code. ${inputs.goal}
    files: "${inputs.files}"
    agent: "${inputs.agent}"
    issue: "${inputs.issue}"
    risk: "${inputs.risk}"
    branch_type: "${inputs.type}"
  docs:
    role: docsync
    needs: [code]
    goal: >-
      Sync the docs of this change (docs-sync skill): compare the diff with docs/, update or add the usage in
      docs/references/ and the index in docs/README.md, run every command, commit. Do not push, do not open a PR.
  build:
    role: developer
    needs: [docs]
    workspace: "same:code"
    agent: "${inputs.agent}"
    goal: >-
      phase: pr. The docs step has committed. Verify, push and open the PR. ${inputs.goal}
  checks:
    type: checks
    needs: [build]
    timeout: 30
    on_fail: {run: ci-fix, rounds: 2}
  ci-fix:
    role: ci-fixer
    manual: true
    workspace: "same:build"
    goal: "A required check on the PR is red. Fix the cause on this branch (ci-fixer skill)."
  report:
    type: report
    needs: [checks]
    always: true
