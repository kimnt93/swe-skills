# Setup A: Claude Code is the only coding agent (Claude login). The reviewer is a fresh Claude session at the top model that sees only the diff and the card.
# One harness, so the reviewer is a fresh session on the same cli. Use it with: SWE_MODELS=cli/examples/models.claude-only.yaml swe-cli models show
# or copy it over your project's models.yaml.
manager: manager
launcher: tmux
clis:
  claude:
    permission_mode: bypassPermissions
    model: sonnet
    ready: ❯
    busy: esc to interrupt
agents:
  manager:
    cli: claude
    model: sonnet
    reasoning: high
  planner:
    cli: claude
    model: opus
    reasoning: high
  developer:
    cli: claude
    model: sonnet
    reasoning: medium
  developer-strong:
    cli: claude
    model: opus
    reasoning: xhigh
  documenter:
    cli: claude
    model: haiku
  scribe:
    cli: claude
    model: haiku
  ci-fixer:
    cli: claude
    model: sonnet
    reasoning: medium
  integrator:
    cli: claude
    model: sonnet
    reasoning: medium
  verifier:
    cli: claude
    model: haiku
  reviewer:
    cli: claude
    model: opus
    reasoning: high
reviewers:
  claude: reviewer
subagents:
  worker:
    agent: developer
  adversary:
    agent: developer-strong
omp_roles: {}
context:
  default:
    window: 272000
    compact_at: 245000
  families:
    claude:
      window: 400000
      compact_at: 350000
  models: {}
autopilot:
  auto_merge: []
