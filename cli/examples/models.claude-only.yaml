# Setup A: Claude Code is the only coding agent, on your Claude subscription (claude auth login).
# One CLI, so no second model family reviews: the reviewer is Claude at tier top (Opus), in a fresh
# session that sees only the diff and the card. The orchestrator is Claude Code itself (swe-cli orchestrate <project>).
# Use it with: SWE_MODELS=cli/examples/models.claude-only.yaml swe-cli bootstrap
orchestrator:
  cli: claude
  tier: mid
launcher: tmux
clis:
  claude:
    permission_mode: bypassPermissions
    ready: ❯
    busy: esc to interrupt
workers:
  claude:
    top:
      model: opus
      effort: xhigh
    mid:
      model: sonnet
      effort: high
    low:
      model: haiku
reviewers:
  claude:
    cli: claude
    tier: top
subagents:
  worker:
    tier: mid
  adversary:
    tier: top
omp_roles:
  default: google-antigravity/gemini-3.8-flash
  smol: google-antigravity/gemini-3.8-flash
  slow: openai-codex/gpt-6-sol
context:
  default:
    window: 272000
    compact_at: 245000
  families:
    claude:
      window: 400000
      compact_at: 350000
  models: {}
autopilot:
  auto_merge: []
