# Setup B: oh-my-pi is the only coding agent, on OpenAI (omp login openai-codex) and Google (omp login google-antigravity) logins.
# One harness, so the reviewer is a fresh session on the same cli. Use it with: SWE_MODELS=cli/examples/models.omp-only.yaml swe-cli models show
# or copy it over your project's models.yaml.
manager: manager
launcher: tmux
clis:
  omp:
    approval_mode: yolo
    model: openai-codex/gpt-6-sol
    ready: π >
    busy: ⎋
agents:
  manager:
    cli: omp
    model: openai-codex/gpt-6-sol
    reasoning: medium
  planner:
    cli: omp
    model: openai-codex/gpt-6-sol
    reasoning: high
  developer:
    cli: omp
    model: openai-codex/gpt-6-sol
    reasoning: medium
  developer-strong:
    cli: omp
    model: openai-codex/gpt-6-sol
    reasoning: high
  documenter:
    cli: omp
    model: google-antigravity/gemini-3.8-flash
    reasoning: low
  scribe:
    cli: omp
    model: google-antigravity/gemini-3.8-flash
    reasoning: low
  ci-fixer:
    cli: omp
    model: openai-codex/gpt-6-sol
    reasoning: medium
  integrator:
    cli: omp
    model: openai-codex/gpt-6-sol
    reasoning: medium
  verifier:
    cli: omp
    model: google-antigravity/gemini-3.8-flash
    reasoning: low
  reviewer:
    cli: omp
    model: openai-codex/gpt-6-sol
    reasoning: high
reviewers:
  omp: reviewer
subagents: {}
omp_roles:
  default: google-antigravity/gemini-3.8-flash
  smol: google-antigravity/gemini-3.8-flash
  slow: openai-codex/gpt-6-sol
context:
  default:
    window: 272000
    compact_at: 245000
  families:
    claude:
      window: 400000
      compact_at: 350000
  models: {}
autopilot:
  auto_merge: []
