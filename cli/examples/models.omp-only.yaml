# Setup B: oh-my-pi is the only coding agent, on OpenAI (omp login openai-codex) and Google (omp login google-antigravity) logins.
# One CLI, so the reviewer is omp at tier top, in a fresh session that sees only the diff and the card.
# The orchestrator is oh-my-pi itself (swe-cli orchestrate <project>).
# Use it with: SWE_MODELS=cli/examples/models.omp-only.yaml swe-cli bootstrap
orchestrator:
  cli: omp
  tier: mid
launcher: tmux
clis:
  omp:
    approval_mode: yolo
    ready: π >
    busy: ⎋
workers:
  omp:
    top:
      model: openai-codex/gpt-6-sol
      thinking: high
    mid:
      model: openai-codex/gpt-6-sol
      thinking: medium
    low:
      model: google-antigravity/gemini-3.8-flash
      thinking: low
reviewers:
  omp:
    cli: omp
    tier: top
subagents: {}
omp_roles:
  default: google-antigravity/gemini-3.8-flash
  smol: google-antigravity/gemini-3.8-flash
  slow: openai-codex/gpt-6-sol
context:
  default:
    window: 272000
    compact_at: 245000
  families:
    claude:
      window: 400000
      compact_at: 350000
  models: {}
autopilot:
  auto_merge: []
