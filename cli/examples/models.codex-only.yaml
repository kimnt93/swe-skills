# Setup C: Codex CLI is the only coding agent, on your ChatGPT login (codex login).
# One CLI, so the reviewer is Codex at tier top, in a fresh session that sees only the diff and the card.
# The orchestrator is Codex itself (swe-cli orchestrate <project>).
# Use it with: SWE_MODELS=cli/examples/models.codex-only.yaml swe-cli bootstrap
orchestrator:
  cli: codex
  tier: mid
launcher: tmux
clis:
  codex:
    approval_policy: never
    sandbox: danger-full-access
    ready: ›
    busy: esc to interrupt
workers:
  codex:
    top:
      model: gpt-6-sol
      effort: high
    mid:
      model: gpt-6-sol
      effort: medium
    low:
      model: gpt-6-luna
      effort: low
reviewers:
  codex:
    cli: codex
    tier: top
subagents: {}
omp_roles:
  default: google-antigravity/gemini-3.8-flash
  smol: google-antigravity/gemini-3.8-flash
  slow: openai-codex/gpt-6-sol
context:
  default:
    window: 272000
    compact_at: 245000
  families:
    claude:
      window: 400000
      compact_at: 350000
  models: {}
autopilot:
  auto_merge: []
