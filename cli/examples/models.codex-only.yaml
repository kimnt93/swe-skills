# Setup C: Codex CLI is the only coding agent (ChatGPT login). The reviewer is a fresh Codex session at the top model.
# One harness, so the reviewer is a fresh session on the same cli. Use it with: SWE_MODELS=cli/examples/models.codex-only.yaml swe-cli models show
# or copy it over your project's models.yaml.
manager: manager
launcher: tmux
clis:
  codex:
    approval_policy: never
    sandbox: danger-full-access
    model: gpt-6-sol
    ready: ›
    busy: esc to interrupt
agents:
  manager:
    cli: codex
    model: gpt-6-sol
    reasoning: medium
  planner:
    cli: codex
    model: gpt-6-sol
    reasoning: high
  developer:
    cli: codex
    model: gpt-6-sol
    reasoning: medium
  developer-strong:
    cli: codex
    model: gpt-6-sol
    reasoning: high
  documenter:
    cli: codex
    model: gpt-6-luna
    reasoning: low
  scribe:
    cli: codex
    model: gpt-6-luna
    reasoning: low
  ci-fixer:
    cli: codex
    model: gpt-6-sol
    reasoning: medium
  integrator:
    cli: codex
    model: gpt-6-sol
    reasoning: medium
  verifier:
    cli: codex
    model: gpt-6-luna
    reasoning: low
  reviewer:
    cli: codex
    model: gpt-6-sol
    reasoning: high
reviewers:
  codex: reviewer
subagents: {}
omp_roles: {}
context:
  default:
    window: 272000
    compact_at: 245000
  families:
    claude:
      window: 400000
      compact_at: 350000
  models: {}
autopilot:
  auto_merge: []
