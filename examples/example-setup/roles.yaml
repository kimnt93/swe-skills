# cli/roles.yaml: one entry per role an agent node can play. A workflow node names a role and may override
# anything here. The role decides which skills the agent enables (and only those) and which agent runs it: an
# agent is a cli + model + reasoning level defined in models.yaml (`agents:`), so a documentation node does not
# use the model a design node needs.
#
#   skills     the plugin skills the agent is told to use, nothing else (the first is the role's own skill)
#   agent      the name of an agent in models.yaml (cli, model, reasoning); a node may name another agent, or
#              override `cli`, `model` or `reasoning` on its own
#   cross_family  true: the agent is the one `reviewers` in models.yaml names for the cli that wrote the node in
#              the workflow's `reviews:` (a reviewer is never the author's family)
#   workspace  new (own worktree and branch) | same:<node> (that node's worktree) | scratch (read-only, origin/main)
#              | pr (the worktree of an open PR's branch)
#   outcome    the last line the agent prints: card | review | node (see cli/brief-node.md)
#   timeout    minutes before the node fails
roles:
  planner:
    skills: [planner, architect, how, project, github]
    agent: planner
    workspace: scratch
    outcome: node
    timeout: 45
  developer:
    skills: [developer, swe, tdd, deslop, changelog, github]
    agent: developer
    workspace: new
    outcome: card
    timeout: 90
  documenter:
    skills: [documenter, deslop, github]
    agent: documenter
    workspace: new
    outcome: card
    timeout: 45
  reviewer:
    skills: [reviewer, interrogate, why, integrator, changelog, github]
    cross_family: true
    agent: reviewer
    workspace: same
    outcome: review
    timeout: 60
  ci-fixer:
    skills: [ci-fixer, tdd, github]
    agent: ci-fixer
    workspace: same
    outcome: card
    timeout: 60
  scribe:
    skills: [changelog, deslop, github]
    agent: scribe
    workspace: pr
    outcome: card
    timeout: 30
  verifier:
    skills: [verifier, verify-maintain, github]
    agent: verifier
    workspace: scratch
    outcome: node
    timeout: 60
  integrator:
    skills: [integrator, github, why]
    agent: integrator
    workspace: pr
    outcome: card
    timeout: 60
