name: feature
description: "A goal split into PR-sized cards, each built, checked and reviewed in parallel; the report lists the PRs ready to merge."
inputs:
  goal: {required: true}
  repo: {default: ""}
  risk: {default: standard}
nodes:
  plan:
    role: planner
    goal: "Plan this goal into PR-sized cards (the planner skill). Goal: ${inputs.goal}"
  cards:
    needs: [plan]
    map: "${nodes.plan.cards}"
    workflow: "${item.workflow|card}"
  report:
    type: report
    needs: [cards]
    always: true
