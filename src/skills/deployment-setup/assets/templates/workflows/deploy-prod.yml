name: Production - Example

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    # Published, non-draft, non-prerelease v* release only; the reusable workflow enforces it again.
    if: startsWith(github.event.release.tag_name, 'v') && !github.event.release.draft && !github.event.release.prerelease
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: <org>/<workflows-repo>/.github/workflows/swarm-deploy.yml@main
    with:
      environment: prod
      stack: example
      compose_file: docker-compose.yaml
