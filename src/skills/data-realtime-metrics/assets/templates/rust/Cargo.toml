[package]
name = "pipeline-metrics-smoke"
version = "0.1.0"
edition = "2021"

# Versions tested with the template. Blocking reqwest: the periodic reader runs on its own thread.
[dependencies]
gethostname = "1"
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["metrics", "http-proto", "reqwest-blocking-client"] }
