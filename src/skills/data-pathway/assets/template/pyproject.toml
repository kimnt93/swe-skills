[project]
name = "pw-orders"
version = "0.1.0"
description = "Realtime Pathway pipeline: Kafka in, transform, Kafka out."
requires-python = ">=3.11"
dependencies = [
    "pathway>=0.26",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pandas>=2"]

[tool.ruff]
line-length = 79
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
