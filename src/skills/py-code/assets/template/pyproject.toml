[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "service"
version = "0.1.0"
description = "Litestar + msgspec service in the standard stack"
requires-python = ">=3.12,<3.14"
dependencies = [
    "litestar>=2.25",                 # msgspec-native web framework (no pydantic)
    "uvicorn[standard]>=0.30",        # uvloop + httptools
    "msgspec>=0.19",                  # API models, messages, settings conversion
    "ciso8601>=2.3",                  # fast ISO 8601 / RFC 3339 parsing
    "psycopg[binary,pool]>=3.2",      # PostgreSQL, plain SQL, no ORM
    "redis>=5",
    "boto3>=1.36",                    # S3-compatible object store (RustFS, MinIO, AWS)
    "confluent-kafka>=2.11,<3",
    "httpx>=0.27",
    "jlogger",                        # unified JSON logs (service-logging skill)
    "opentelemetry-api>=1.27",
]

[project.scripts]
service = "service.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "fakeredis>=2.23", "freezegun>=1.5"]

[tool.uv.sources]
jlogger = { git = "https://github.com/kimnt93/jlogger.git" }

[tool.hatch.build.targets.wheel]
packages = ["src/service"]

[tool.ruff]
line-length = 79  # PEP 8
target-version = "py312"
# vendored from the service-logging skill: update it there, not here
extend-exclude = ["src/service/observability/service_logging.py"]

[tool.ruff.lint]
# PEP 8: pycodestyle (E, W), pep8-naming (N), import order (I), pyflakes (F), plus bug/simplify/async checks.
# Readability: C901 and PLR09xx fail a function that has too many branches, returns, arguments or statements.
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "ASYNC",
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "TID251",
]

# Banned imports: the error names what to use instead (enforced, not just written in the py-code skill).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pydantic".msg = "Use msgspec: API and message models are msgspec.Struct (py-code skill, stack reference)."
"pandas".msg = "Use polars: no pandas in services or pipelines (py-code skill, data reference)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]  # pytest fixtures and parameters are arguments

[tool.ruff.lint.mccabe]
max-complexity = 10  # readability: split a function that branches more

[tool.ruff.lint.pylint]
max-args = 5
max-returns = 6
max-branches = 12
max-statements = 40

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs real PostgreSQL, Redis and Kafka (see references/testing)"]
addopts = "-m 'not integration'"

# Architecture, enforced (the ARCHITECTURE.md layering): `lint-imports` fails a PR that breaches it.
# api/app.py is the composition root: it wires the adapters inside its lifespan function.
[tool.importlinter]
root_package = "service"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "adapters -> application -> domain"
type = "layers"
layers = [
    "service.cli",
    "service.api | service.messaging | service.db",
    "service.application",
    "service.domain",
]
# The composition root, and only it, wires adapters together.
ignore_imports = [
    "service.api.app -> service.db.*",
    "service.api.app -> service.messaging.*",
]

[[tool.importlinter.contracts]]
name = "the domain does no I/O"
type = "forbidden"
source_modules = ["service.domain"]
forbidden_modules = ["litestar", "psycopg", "psycopg_pool", "redis", "confluent_kafka", "boto3", "httpx", "requests"]
