[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

# One place for versions. Members use `dep.workspace = true`.
[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
axum = "0.8"
utoipa = "5"          # OpenAPI document generated from the handler annotations
tower = "0.5"
subtle = "2"
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-time-0_3"] }
deadpool-postgres = "0.14"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
rdkafka = { version = "0.38", features = ["cmake-build"] } # needs cmake and a C toolchain at build time
futures-util = "0.3"
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
svc-core = { path = "crates/svc-core" }
svc-infra = { path = "crates/svc-infra" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"      # no unwrap/expect on external input; tests may allow it
expect_used = "warn"
# readability: a function that outgrows one screen or gets too branchy fails clippy -D warnings (limits in clippy.toml)
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"

[profile.dev]
debug = "line-tables-only"   # disk and time economy
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = false
