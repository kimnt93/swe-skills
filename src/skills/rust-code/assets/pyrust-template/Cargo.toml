[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# One version set: pyo3, numpy (and pyo3-polars + polars when used) move together; never bump one alone.
[workspace.dependencies]
thiserror = "2"
pyo3 = { version = "0.28", features = ["abi3-py311"] }
numpy = "0.28"
example-ta-core = { path = "crates/example-ta-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# readability: a function that outgrows one screen or gets too branchy fails clippy -D warnings (limits in clippy.toml)
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = false
